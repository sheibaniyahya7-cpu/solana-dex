# Development overrides — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# The development image stage runs as root, so bind-mounting host source over
# /app is safe here; the production stage runs as a non-root user and must use
# the code baked into the image instead.

services:
  backend:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    environment:
      APP_ENV: development
      DEBUG: "true"
    volumes:
      - ./backend:/app

  frontend:
    build:
      target: deps
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  celery_worker:
    build:
      target: development
    command: celery -A app.core.celery_app worker --loglevel=debug --concurrency=2 -Q collectors,monitors,analyzers,alerts,default
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs

  celery_beat:
    build:
      target: development
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - celerybeat_data:/app/celerybeat

  # pgAdmin for database management in dev
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dex_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dex.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadminpassword}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - dex_network

  # Redis Commander for cache inspection
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: dex_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-redispassword}"
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - dex_network
