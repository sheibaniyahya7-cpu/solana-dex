services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dexuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dexpassword}
      POSTGRES_DB: ${POSTGRES_DB:-dextrader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dexuser} -d ${POSTGRES_DB:-dextrader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dex_network

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dex_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dex_network

  # ─── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dex_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dexuser}:${POSTGRES_PASSWORD:-dexpassword}@postgres:5432/${POSTGRES_DB:-dextrader}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dex_network

  # ─── Celery Worker ────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dex_celery_worker
    restart: unless-stopped
    # `default` is required: cleanup-old-data is scheduled onto it.
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q collectors,monitors,analyzers,alerts,default
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dexuser}:${POSTGRES_PASSWORD:-dexpassword}@postgres:5432/${POSTGRES_DB:-dextrader}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image healthcheck probes the HTTP API, which this service does not run.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - dex_network

  # ─── Celery Beat (Scheduler) ──────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dex_celery_beat
    restart: unless-stopped
    command: >
      celery -A app.core.celery_app beat --loglevel=info
      --scheduler celery.beat:PersistentScheduler
      --schedule /app/celerybeat/celerybeat-schedule
      --pidfile /app/celerybeat/celerybeat.pid
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dexuser}:${POSTGRES_PASSWORD:-dexpassword}@postgres:5432/${POSTGRES_DB:-dextrader}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
    volumes:
      - backend_logs:/app/logs
      - celerybeat_data:/app/celerybeat
    depends_on:
      - celery_worker
    # Beat exposes no HTTP endpoint, so the image healthcheck cannot apply.
    healthcheck:
      disable: true
    networks:
      - dex_network

  # ─── Flower (Celery Monitor) ──────────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dex_flower
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flowerpassword}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dexuser}:${POSTGRES_PASSWORD:-dexpassword}@postgres:5432/${POSTGRES_DB:-dextrader}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - celery_worker
    # Flower serves on 5555, not the API's 8000, so the image healthcheck fails.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dex_network

  # ─── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: dex_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dex_network

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - dex_network

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
  backend_logs:
  nginx_logs:

networks:
  dex_network:
    driver: bridge
